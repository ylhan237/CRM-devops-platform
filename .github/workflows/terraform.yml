# Terraform: validate, then — manually — plan and apply.
#
# There are two paths through this workflow, and they share the first steps only.
#
# Pull request: fmt, init without a backend, validate. No plan against the real
# state, and that is deliberate rather than a limitation. Planning a pull request
# against the production backend would hand every contributor read access to the
# real inventory, including resource ids and the ACR login server, and would let a
# pull request author see what a change would destroy before anyone had reviewed it.
#
# workflow_dispatch: the same checks, then a plan against the real state, then an
# apply of *that* plan, gated by an environment that requires a human approval.
#
# The apply is manual because the brief asks for an infrastructure pipeline and a
# manual apply is not one. What it is instead is an apply that a person starts and
# a person approves, with the plan in between so that what is approved is what
# runs. Doing it by hand from a laptop was the previous arrangement and it was
# worse in every way that matters: no trace, no plan attached to the change, and a
# state file that only exists on one machine.

name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform-azure-vms-and-acr/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type APPLY to enable the apply job. The environment still requires an
          approval, so this is not the last gate.
        required: false
        type: string
      destroy:
        description: >-
          Set to true to plan a destroy of the whole configuration. Refused unless
          confirm is also APPLY.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  # Serial rather than cancel-in-progress, and the difference matters here. Two
  # runs applying at once would race on the state lock, and one would be cancelled
  # halfway through leaving a resource created and a state file that does not
  # mention it. Cancelling the earlier run of a *check* is convenient; cancelling
  # the earlier run of an *apply* is destructive.
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "false"
  STATE_RESOURCE_GROUP: crm-state
  STATE_STORAGE_ACCOUNT: crmtfstate
  STATE_CONTAINER: tfstate

jobs:
  # -------------------------------------------------------------- pull request ----

  check:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform-azure-vms-and-acr

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tag is v4. setup-terraform@v3 is what most examples still say, and it is
      # two majors behind.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - name: Check the Azure credentials are present
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in ARM_SUBSCRIPTION_ID ARM_TENANT_ID ARM_CLIENT_ID ARM_CLIENT_SECRET; do
            # Indirect expansion, so the value is never echoed. Only the name is.
            value="${!name}"
            if [ -z "${value}" ]; then
              missing+=("${name}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            echo ""
            echo "They are repository settings, not files. To set them:"
            echo "  gh secret set ARM_SUBSCRIPTION_ID"
            exit 1
          fi
          echo "All four credentials are present."
          echo ""
          echo "Present is not correct. Only the plan on main, or a manual run,"
          echo "proves correct: it authenticates and asks Azure what exists."
          echo ""
          # Shape only, never the value. A subscription ID that is not a UUID is
          # caught here rather than as an opaque 401 later.
          if ! printf '%s' "${ARM_SUBSCRIPTION_ID}" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::ARM_SUBSCRIPTION_ID is not a UUID. Found ${#ARM_SUBSCRIPTION_ID} characters."
            exit 1
          fi

      # fmt before init: it needs no provider and no network, so a formatting problem
      # is reported in two seconds instead of after a provider download.
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(terraform fmt -check -recursive -no-color || true)"
          if [ -n "${unformatted}" ]; then
            echo "::error::These files are not formatted. Run: terraform fmt -recursive"
            printf '%s\n' "${unformatted}" | sed 's/^/  /'
            exit 1
          fi
          echo "Formatting is clean."

      # -backend=false on this path only. The state is in a remote backend that only
      # the manual path has credentials for, and a pull request has no business
      # reading it.
      #
      # No -lockfile=readonly, deliberately. The lock file is gitignored in this
      # configuration, so it is absent from the checkout, and readonly explicitly
      # refuses to run without an existing lock file.
      - name: terraform init
        run: terraform init -backend=false -input=false -no-color

      - name: terraform validate
        run: terraform validate -no-color

      - name: Explain what a pull request does not do
        run: |
          {
            echo "## terraform: configuration checked, state untouched"
            echo ""
            echo "Formatting and schema are valid. **No plan was run against the real"
            echo "state**, on purpose: it would expose the production inventory to every"
            echo "contributor and show an unreviewed author what a change would destroy."
            echo ""
            echo "To plan and apply, run this workflow manually from the Actions tab."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ------------------------------------------------------------------ bootstrap ----

  # Creates the storage account that holds the Terraform state.
  #
  # This job exists because of a bootstrap paradox, and it is worth being explicit
  # about why it is not written in Terraform. The backend configuration points at a
  # storage account, so `terraform init` cannot run until that account exists. If the
  # account were itself a Terraform resource, the Terraform that had to create it
  # would need a backend that does not exist yet.
  #
  # So this one step uses the Azure CLI directly. It is idempotent: running it twice
  # finds the account and leaves it alone. It touches only the state account and
  # never the CRM resources, so it is safe to run on a schedule.
  #
  # Cost: a Standard_LRS account is a fraction of a cent per month.
  bootstrap:
    name: bootstrap the state storage
    # Only ever on a manual run. Never on a pull request: a pull request must not be
    # able to create cloud resources, whatever it contains.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check.outputs.created }}
      # Threaded into plan and apply. The state account and the resources have to be
      # in the same region, and the azurerm backend refuses when they are not. Passing
      # the resolved value rather than letting each job read the variable independently
      # is what makes that guarantee hold instead of being a coincidence.
      location: ${{ steps.region.outputs.location }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}'

      # The subscription carries the Azure policy sys.regionrestriction, which
      # restricts deployments to a fixed list of regions. Creating anything outside it
      # fails with RequestDisallowedByAzure and a paragraph about "best available
      # regions", which reads like a quota problem and is not.
      #
      # The regions this subscription may use are germanywestcentral, spaincentral,
      # italynorth, swedencentral and polandcentral. germanywestcentral is the default
      # because it is the closest to France of those, and because it is what
      # variables.tf uses, so the two cannot disagree silently.
      #
      # The policy is read and printed rather than trusted, so that if the list
      # changes the next run says so instead of failing with the same paragraph.
      - name: Resolve and check the region
        id: region
        env:
          REQUESTED: ${{ vars.AZURE_LOCATION }}
        run: |
          set -euo pipefail

          DEFAULT="germanywestcentral"

          echo "### Region"
          echo ""
          if az policy assignment show \
               --name sys.regionrestriction \
               --output json >/dev/null 2>&1; then
            allowed="$(az policy assignment show \
              --name sys.regionrestriction \
              --query "parameters.listOfAllowedLocations.value" \
              --output tsv 2>/dev/null | tr -d '\r' || true)"
            echo "The subscription restricts deployments to:"
            printf '%s\n' "${allowed}" | sed 's/^/  - /'
          else
            allowed=""
            echo "No sys.regionrestriction assignment found at subscription scope."
          fi

          if [ -n "${REQUESTED}" ]; then
            region="${REQUESTED}"
            source="the repository variable AZURE_LOCATION"
          else
            region="${DEFAULT}"
            source="the built-in default"
          fi

          # Checked before creating anything. The API error for a forbidden region and
          # the error for a nonexistent one are both RequestDisallowedByAzure here, so
          # catching it now turns a paragraph of policy text into one line naming the
          # permitted set.
          if [ -n "${allowed}" ] && ! printf '%s\n' "${allowed}" | grep -qx "${region}"; then
            echo ""
            echo "::error::${region} is not a region this subscription may deploy to."
            echo "Permitted:"
            printf '%s\n' "${allowed}" | sed 's/^/  - /'
            echo ""
            echo "Either change the default in infra/terraform-azure-vms-and-acr/variables.tf"
            echo "or override the region for the pipeline:"
            echo "  gh variable set AZURE_LOCATION --body <region>"
            exit 1
          fi

          echo ""
          echo "Region: \`${region}\` (from ${source})."
          echo "location=${region}" >> "${GITHUB_OUTPUT}"

      - name: Create the state storage account
        id: check
        env:
          RG: ${{ env.STATE_RESOURCE_GROUP }}
          ACCOUNT: ${{ env.STATE_STORAGE_ACCOUNT }}
          CONTAINER: ${{ env.STATE_CONTAINER }}
          LOCATION: ${{ steps.region.outputs.location }}
        run: |
          set -euo pipefail

          # The resource group, if it is not there yet.
          #
          # A resource group's region is immutable once it exists. The first run of
          # this job created crm-state in westeurope and then failed on the storage
          # account, because the location policy applies to the account and not to the
          # group. So the group is now in a region the policy forbids, and
          #
          #   az group create --location germanywestcentral
          #
          # fails with InvalidResourceGroupLocation rather than moving anything.
          #
          # It does not need to move. A storage account is not required to sit in its
          # resource group's region, and the azurerm backend uses the group only as a
          # scope: it reads and writes blobs in the account. So the group is left
          # where it is, the account is created in a region the policy allows, and the
          # difference is reported rather than hidden.
          #
          # To move it after the fact the group has to be deleted and recreated, which
          # is only safe while it is empty. It is empty here, because the account was
          # never created, so on a fresh subscription:
          #
          #   az group delete -n crm-state
          #
          # then this job recreates it. That is deliberately not done automatically:
          # deleting a resource group deletes everything in it, and a job that can do
          # that unattended should not be able to.
          if az group show --name "${RG}" >/dev/null 2>&1; then
            existing_location="$(az group show --name "${RG}" --query location --output tsv)"
            echo "The state resource group ${RG} already exists in ${existing_location}."
            if [ "${existing_location}" != "${LOCATION}" ]; then
              echo ""
              echo "::warning::That differs from the region this run resolved (${LOCATION})."
              echo "It is left as it is: a resource group's region cannot be changed, and"
              echo "a storage account does not have to be in its group's region."
            fi
          else
            echo "Creating the state resource group ${RG} in ${LOCATION}..."
            az group create --name "${RG}" --location "${LOCATION}" --output none
          fi

          if az storage account show --name "${ACCOUNT}" --resource-group "${RG}" >/dev/null 2>&1; then
            echo "The state account ${ACCOUNT} already exists."
            echo "created=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Creating the storage account ${ACCOUNT} in ${LOCATION}..."
            az storage account create \
              --name "${ACCOUNT}" \
              --resource-group "${RG}" \
              --location "${LOCATION}" \
              --sku Standard_LRS \
              --encryption-services blob \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --output none
            echo "created=true" >> "${GITHUB_OUTPUT}"
          fi

          # The container is what the backend actually reads and writes. Creating it
          # separately rather than relying on the backend to create it keeps the
          # failure here, where the message names the container.
          if az storage container show \
               --name "${CONTAINER}" \
               --account-name "${ACCOUNT}" >/dev/null 2>&1; then
            echo "The container ${CONTAINER} already exists."
          else
            az storage container create \
              --name "${CONTAINER}" \
              --account-name "${ACCOUNT}" \
              --auth-mode login \
              --output none
            echo "Created the container ${CONTAINER}."
          fi

          # Computed before the summary rather than inside it. A command substitution
          # wrapping a double-quoted string, inside a double-quoted echo, is quoting
          # that works until it does not, and a broken summary is not worth the
          # cleverness.
          rg_location="$(az group show --name "${RG}" --query location --output tsv 2>/dev/null || echo unknown)"
          account_location="$(az storage account show --name "${ACCOUNT}" --resource-group "${RG}" --query location --output tsv 2>/dev/null || echo unknown)"

          {
            echo "## State storage"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| resource group | \`${RG}\` |"
            echo "| resource group region | \`${rg_location}\` |"
            echo "| storage account | \`${ACCOUNT}\` |"
            echo "| storage account region | \`${account_location}\` |"
            echo "| container | \`${CONTAINER}\` |"
            echo "| created now | ${ACCOUNT} |"
            echo ""
            echo "The Terraform state lives here from this run onwards. Public access is"
            echo "off and TLS 1.2 is the floor."
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------- plan ----

  plan:
    name: plan
    needs: [check, bootstrap]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform-azure-vms-and-acr

    outputs:
      # Exposed so the apply step can distinguish "there are changes" from "the plan
      # failed". Without this every step after it has to guess, and a step guarding
      # against destroys ends up guarding nothing.
      exit_code: ${{ steps.plan.outputs.exit_code }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}'

      # A pull request must not be able to plan against the real state, so this whole
      # job is manual-only. Stated at the job level as well as in the trigger, so that
      # widening the trigger later does not silently open the state up.
      - name: Refuse to plan with the throwaway SSH key
        env:
          # UPPERCASE name, because that is what GitHub stores.
          #
          # `gh variable set TF_VAR_ssh_public_key` creates the variable as
          # TF_VAR_SSH_PUBLIC_KEY: the CLI normalises repository variable names to
          # upper case, and `vars.X` in an expression does not. Referencing it in
          # lower case resolves to an empty string, the guard below then refuses to
          # plan, and the message blames a missing key that is plainly visible in the
          # repository settings.
          #
          # A repository variable, not a secret. A public key authorises nothing on
          # its own, and being able to read it makes a wrong value obvious.
          REAL_SSH_KEY: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REAL_SSH_KEY}" ]; then
            echo "::error::The repository variable TF_VAR_SSH_PUBLIC_KEY is not set."
            echo ""
            echo "The plan and apply use it, and the throwaway key in the pull request"
            echo "path belongs to nothing. Applying with it would create a machine nobody"
            echo "can log into."
            echo ""
            echo "To set it. Note the CLI upper-cases the name:"
            echo "  gh variable set TF_VAR_ssh_public_key --body \"\$(cat ~/.ssh/id_ed25519.pub)\""
            exit 1
          fi
          case "${REAL_SSH_KEY}" in
            *plan-only-not-a-real-key*)
              echo "::error::TF_VAR_SSH_PUBLIC_KEY still holds the throwaway key."
              echo "Applying that would create an unreachable machine."
              exit 1
              ;;
          esac
          case "${REAL_SSH_KEY}" in
            ssh-*|ecdsa-*) : ;;
            *)
              echo "::error::TF_VAR_SSH_PUBLIC_KEY does not look like a public key."
              echo "First characters: ${REAL_SSH_KEY:0:20}"
              echo "Expected something starting with ssh- or ecdsa-."
              exit 1
              ;;
          esac
          echo "A real SSH key is configured."

      - name: terraform init
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # The backend is passed entirely by flag. Nothing about the state location
          # is in the repository, so a fork cannot point this at someone else's
          # storage account.
          terraform init \
            -input=false -no-color \
            -backend-config="resource_group=${STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${STATE_CONTAINER}" \
            -backend-config="key=access_key" \
            -backend-config="use_azuread_auth=true"

      # The saved plan is what the apply job consumes, not a re-plan. This is the
      # whole point of the gate: what is approved is what runs, byte for byte.
      - name: terraform plan
        id: plan
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
          # The region bootstrap resolved, not a value read again here, so the
          # resources cannot land somewhere the state account is not.
          TF_VAR_location: ${{ needs.bootstrap.outputs.location }}
          CONFIRM: ${{ inputs.confirm }}
          DESTROY: ${{ inputs.destroy }}
        run: |
          set -uo pipefail

          if [ "${CONFIRM}" != "APPLY" ]; then
            echo "::error::inputs.confirm must be APPLY. Nothing was planned."
            echo ""
            echo "This is a typing gate, not an approval gate: the environment below"
            echo "still asks a person to approve before anything is created."
            exit 1
          fi

          if [ "${DESTROY}" = "true" ]; then
            echo "### A destroy was requested"
            echo ""
            echo "- destroy=true plans the removal of everything, including the"
            echo "  virtual machine that bills every minute it runs."
            echo "- It was also requested with inputs.confirm, which stops it being"
            echo "  typed by accident."
            echo ""
            target=("-destroy")
            plan_args=("-destroy" "-out=tfplan")
          else
            plan_args=("-out=tfplan")
          fi

          set +e
          terraform plan \
            -input=false -lock=true -no-color \
            -detailed-exitcode \
            "${plan_args[@]}" 2>&1 | tee /tmp/plan.txt
          code=${PIPESTATUS[0]}
          set -e

          {
            echo "## terraform plan"
            echo ""
            if [ "${code}" -eq 2 ]; then
              echo "Changes would be applied. The apply is gated on an approval."
            elif [ "${code}" -eq 0 ]; then
              echo "Nothing to do: the state already matches the configuration."
            else
              echo "The plan **failed**. If it stopped on Azure, the credentials are"
              echo "wrong: a wrong subscription, a wrong tenant, or a principal without"
              echo "the Contributor role on the subscription."
            fi
            echo ""
            echo '```'
            grep -E '^(Plan:|No changes|Error:|╷|│|╵)' /tmp/plan.txt || tail -20 /tmp/plan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"

          # 0 and 2 are both successes. Only 1 is a failure.
          #
          # The first version of this ended with `exit "${code}"`, which turned every
          # successful plan into a red check: -detailed-exitcode returns 2 precisely
          # when there are changes to make, and before anything is applied there
          # always are.
          if [ "${code}" -eq 1 ]; then
            exit 1
          fi
          exit 0

      # The plan file contains the provider's partial state, which includes the
      # credentials it was given, and it is the input to an apply that creates billable
      # resources. Artifact retention is set to one day for that reason.
      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/terraform-azure-vms-and-acr/tfplan
          retention-days: 1
          if-no-files-found: error

  # --------------------------------------------------------------------- apply ----

  apply:
    name: apply
    needs: [plan]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The gate. This is the GitHub equivalent of the hand-approval gate, except it
    # happens inside the pipeline, so the plan it approves is the plan that runs and
    # the whole thing is in the log.
    #
    # The environment is set up with prevent_self_review, so the person who started
    # the run cannot be the person who approves it. Without that, the gate is a
    # formality: one person types APPLY and clicks approve.
    environment: production
    defaults:
      run:
        working-directory: infra/terraform-azure-vms-and-acr

    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}'

      - name: Download the plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra/terraform-azure-vms-and-acr

      - name: terraform init
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          terraform init \
            -input=false -no-color \
            -backend-config="resource_group=${STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${STATE_CONTAINER}" \
            -backend-config="key=access_key" \
            -backend-config="use_azuread_auth=true"

      # `terraform apply tfplan`, not `terraform apply`. This is the difference between
      # applying the plan that was approved and planning again at apply time, which
      # would create whatever Azure looks like in between.
      - name: terraform apply
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -f tfplan ] || { echo "::error::No plan file. Nothing was applied."; exit 1; }
          terraform apply -input=false -no-color -auto-approve tfplan

      # After a destroy, or after replacing the resource group, the backend
      # configuration itself may no longer be readable. A failure here is a real
      # consequence of the apply, so it is reported rather than swallowed.
      - name: Report what now exists
        run: |
          {
            echo ""
            echo "## Applied"
            echo ""
            echo "Outputs, so the next step does not need the console:"
            echo '```'
            terraform output -no-color 2>/dev/null || echo "(outputs unavailable: the backend may have been destroyed)"
            echo '```'
            echo ""
            echo "The three Azure secrets are still unset, so the ACR mirror in"
            echo "release.yml will keep announcing that it skips. See APPLY.md step 6."
          } >> "${GITHUB_STEP_SUMMARY}"
          terraform output -no-color 2>/dev/null || true
