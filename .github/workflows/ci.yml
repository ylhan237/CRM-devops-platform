# Test pipeline for the CRM application.
#
# One workflow, five independent jobs and a gate. The jobs do not depend on each
# other so they run in parallel; only the gate aggregates them. Chaining them, as
# the diagram in note.md suggests, would mean a slow linter delays a test that
# does not need it.
#
# The job names are the ones note.md section 4.4 lists as required status checks
# for main. Renaming one silently changes the branch protection rule, so they are
# the contract between this file and the repository settings.
#
# No container is built or run here. This pipeline tests the application as it
# is, from source, which is the point of this phase: the container build and the
# images come later, in the release workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run in flight. Without this, a series
# of pushes to a PR queues five jobs per commit and the runner minutes go on
# checking revisions nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  BACKEND_MODULES: >-
    api-gateway auth-service Event_Management_System Notification_Service
    service-discovery Student_Management_Service Task_Management_Service
  # Two floors, not one, because the two halves are not at the same place.
  # Measured: backend 284/1392 lines = 20.40%, frontend 486/1463 = 33.22%.
  # The brief asks for 30%; the backend is not there yet, so its floor starts
  # below the measurement and ratchets up. See the jacoco.line.coverage.minimum
  # comment in build-tools for the sequence.
  BACKEND_COVERAGE_FLOOR: '0.18'
  FRONTEND_COVERAGE_FLOOR: '0.30'

jobs:
  # ---------------------------------------------------------------- lint ----
  # Static analysis only. It reports, it does not build, and it is the cheapest
  # job, so it is the one that should fail first when something is wrong.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Checkstyle
        # The ruleset lives in CRM_Backend/checkstyle.xml and the build-tools
        # parent binds this goal to validate, so a plain build checks it too.
        # The explicit goal here means the job also works on a module that has
        # not been compiled yet.
        #
        # System Maven rather than the bundled wrapper: mvnw was committed from
        # Windows and carries no executable bit, so ./mvnw is not runnable on a
        # Linux runner.
        run: |
          status=0
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            mvn -B -ntp -f "CRM_Backend/$module/pom.xml" checkstyle:check \
              -Dcheckstyle.failOnViolation=true || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Front/CRM/package-lock.json

      - name: Install frontend dependencies
        working-directory: Front/CRM
        # `npm ci`, and again here.
        #
        # It was bypassed with `npm install` because package-lock.json had not been
        # regenerated since eslint and prettier were added to package.json, and a full
        # npm install could not complete on the machine this was written on. That is
        # why the release builds were failing while CI was green: the workflow
        # worked around the desync and the Dockerfile could not.
        #
        # `npm install --package-lock-only` refreshes the lockfile from package.json
        # without downloading anything into node_modules, and it did it in 28 seconds
        # against the 40-plus minutes a full install had been taking. `npm ci --dry-run`
        # then passes, which is what a desynced lockfile would refuse.
        #
        # `npm ci` and not `npm install`, because npm ci installs exactly what the
        # lockfile says and fails when the two disagree. That failure is the check
        # this step exists to run.
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: Front/CRM
        # Fails on errors. Warnings are printed and counted in the log: the
        # recommended rule sets are demoted to warnings in eslint.config.js, and
        # the counts from this run are what decides which ones to promote.
        run: npm run lint

      - name: TypeScript type check
        working-directory: Front/CRM
        # The one frontend check that always blocks. It needs no extra tooling
        # and it catches the class of error this codebase actually produces:
        # a renamed method, a wrong argument type, a missing import.
        run: npx tsc --noEmit -p tsconfig.json

      - name: Prettier
        working-directory: Front/CRM
        # Reported, not enforced. The service code has never been run through
        # Prettier, so `prettier --check` fails on nearly every file, and
        # enforcing it means a reformat of the whole frontend: that is a commit
        # of its own, it would bury this toolchain, and it would collide with
        # every other frontend branch in flight.
        #
        # The count printed here is the size of that job. This step starts
        # failing the build the day after `npm run format` is merged.
        run: npm run format:check
        continue-on-error: true

  # ----------------------------------------------------------- unit-test ----
  # Fast tests, no external service. The seven services are built in sequence
  # rather than as a matrix so the job keeps the single status check name that
  # note.md 4.4 requires; a matrix would publish one check per module and the
  # branch protection rule would have to match all seven.
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Backend tests
        run: |
          status=0
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            # verify rather than test, so jacoco:report runs and the coverage
            # job has something to read.
            mvn -B -ntp -f "CRM_Backend/$module/pom.xml" verify || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Front/CRM/package-lock.json

      - name: Install frontend dependencies
        working-directory: Front/CRM
        # Same reason as the lint job, and the same lockfile. Commented once, in
        # the first occurrence, so this is not repeated here.
        run: npm ci --no-audit --no-fund

      - name: Frontend specs
        working-directory: Front/CRM
        # Coverage on, not off: this run produces the report that
        # coverage-gate reads, so instrumenting here costs one extra pass and
        # saves running the whole suite a second time.
        run: npm run test:coverage

      # The coverage job runs on its own runner, so the reports have to travel.
      # Without this the job checks out a clean tree, finds no jacoco.xml, and
      # fails on a report that was produced successfully a minute earlier.
      - name: Upload backend coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: CRM_Backend/*/target/site/jacoco/jacoco.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: istanbul-report
          path: Front/CRM/coverage/crm/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  # ----------------------------------------------------- integration-test ----
  # Tests that need a real MySQL. Testcontainers starts it, so no service has to
  # be installed on the runner and no port has to be reserved.
  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Integration tests
        # The failsafe goals are invoked directly rather than through `verify`.
        # Going through the lifecycle re-runs surefire, which would repeat the
        # whole unit suite on every service and start the same containers again
        # for a result already produced by the unit-test job.
        #
        # No -Dit.test either: build-tools already includes **/*IT.java, and
        # passing the pattern as a filter is what produced "No tests matching
        # pattern *IT" on the services that have none.
        run: |
          status=0
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            mvn -B -ntp -f "CRM_Backend/$module/pom.xml" \
              test-compile failsafe:integration-test failsafe:verify || status=1
            echo "::endgroup::"
          done
          exit $status

  # ------------------------------------------------------ non-regression ----
  # What must not change: the API contract the gateway publishes, and the shape
  # of the MySQL schema the migrations produce. These are the two things a
  # refactor breaks silently, so they get their own job instead of riding along
  # with the unit tests.
  non-regression:
    name: non-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Gateway route contract
        run: mvn -B -ntp -f CRM_Backend/api-gateway/pom.xml verify

      - name: Schema contract against a real MySQL 8
        # An *IT, because it needs a real database: Testcontainers starts MySQL
        # 8 so the schema is produced by the migrations themselves rather than
        # by whatever H2 happens to be on the classpath. Failsafe is invoked
        # directly so this job does not repeat the unit suite.
        run: |
          mvn -B -ntp -f CRM_Backend/auth-service/pom.xml \
            test-compile failsafe:integration-test failsafe:verify \
            -Dit.test='*Schema*IT'

  # ------------------------------------------------------- coverage-gate ----
  # Aggregates what unit-test produced. The floor is checked on the total
  # across every module, never per module, for the reason documented in
  # scripts/check-coverage.mjs.
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The reports were produced on the unit-test runner. They are downloaded,
      # never regenerated: running the suite twice to measure it twice would
      # double the slowest job in the pipeline for no extra information.
      - name: Download backend coverage reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: coverage-reports

      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: istanbul-report
          path: coverage-frontend

      - name: Backend coverage floor
        run: |
          count=$(find coverage-reports -name 'jacoco.xml' | wc -l)
          if [ "$count" -ne 7 ]; then
            echo "Expected 7 JaCoCo reports, found $count." >&2
            find coverage-reports -name 'jacoco.xml'
            exit 1
          fi
          node scripts/check-coverage.mjs \
            --floor "$BACKEND_COVERAGE_FLOOR" \
            --format jacoco \
            $(find coverage-reports -name 'jacoco.xml')

      - name: Frontend coverage floor
        # The two floors are checked separately rather than added together: a
        # Java report and a JavaScript report measure different code, and
        # summing them would let one side hide the other.
        run: |
          node scripts/check-coverage.mjs \
            --floor "$FRONTEND_COVERAGE_FLOOR" \
            --format istanbul \
            coverage-frontend/coverage-summary.json

  # --------------------------------------------------------- dependency-scan ----
  # OWASP Dependency-Check, which note.txt asks for at the end: "pour tester les vul
  # on a owasp".
  #
  # Trivy, in the release workflow, scans the built image's operating-system packages
  # and the layers above the application. It says nothing about the 400-odd Java and
  # JavaScript libraries the application itself pulls in, which is where most of the
  # reachable CVEs in a Spring Boot application are. This job looks at those.
  #
  # Reported, not blocking, and the reason is specific rather than cautious. The
  # dependency tree here carries transitive Spring and Node packages that will have
  # published CVEs, and a blocking scan on a project that has never been scanned turns
  # the first run into a wall of findings nobody has triaged. The output is the
  # triage list; making it blocking is a one-word change once the list is short
  # enough to be a rule rather than a project.
  #
  # `continue-on-error: true` is on the step, and the job still reports a failure, so
  # the job is not in the gate. The two are not the same thing: a step that always
  # passes would also not be in the gate, and this one at least shows up in the run.
  dependency-scan:
    name: dependency-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Dependency-Check resolves the tree and downloads an NVD feed that is several
      # hundred megabytes. Cached, because without it every run pays for the download
      # and the job spends more time on the feed than on the seven modules.
      - name: Cache the NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-dc-${{ hashFiles('CRM_Backend/build-tools/pom.xml') }}
          restore-keys: owasp-dc-

      - name: OWASP Dependency-Check (backend)
        # The seven modules each have their own pom and none at the root, so the
        # aggregate goal is invoked per module rather than through a parent that does
        # not exist. `--failOnError` off, because the threshold is a decision and not
        # yet a made one; the report is what has value here.
        run: |
          mkdir -p reports
          # 13.0.0, pinned. Without a version Maven resolves the latest release, so two
          # runs a month apart scan different trees and a new finding cannot be told
          # apart from a new plugin. The same reason the action tags are pinned.
          DC_VERSION="13.0.0"
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            mvn -B -ntp -q \
              -f "CRM_Backend/$module/pom.xml" \
              "org.owasp:dependency-check-maven:${DC_VERSION}:check" \
              -Dformat=HTML \
              -DfailBuildOnCVSS=11 \
              -DfailOnError=false \
              -DoutputDirectory="$PWD/reports/$module" \
              -Ddata.directory="$HOME/.m2/repository/org/owasp/dependency-check-data" \
              || echo "::warning::$module : the scan itself failed"
            echo "::endgroup::"
          done

      - name: Frontend dependencies
        working-directory: Front/CRM
        # The JavaScript half of the same question. `npm audit` reads the lockfile and
        # is a minute's work against a dependency tree of several hundred packages, so
        # excluding it would leave the larger half of the surface unscanned because the
        # tool for it happens to be a separate command.
        #
        # `npm audit fix --dry-run` rather than `npm audit`: the first reports, the
        # second decides. A security step that rewrites the lockfile would produce a
        # different tree on every run and a diff nobody reviewed.
        run: |
          npm audit --audit-level=high 2>&1 | tee /tmp/npm-audit.txt || true
          echo ""
          echo "### npm audit"
          echo '```'
          # The summary line carries the counts, which is what a reader needs here.
          tail -20 /tmp/npm-audit.txt || echo "(no output)"
          echo '```'

      - name: Collect the reports
        run: |
          found="$(find reports -name 'dependency-check-report.html' | wc -l)"
          if [ "$found" -ne 7 ]; then
            echo "::warning::Expected 7 reports, found $found. Some modules may have"
            echo "::warning::failed before producing one."
            find reports -name '*.html' || true
          else
            echo "7 reports produced."
          fi

      # The run summary, because a report nobody opens changes nothing. Counts only,
      # no package names: the HTML has those.
      - name: Summarise
        run: |
          {
            echo "## OWASP dependency scan"
            echo ""
            echo "Scans the libraries the application pulls in. Trivy, in the release"
            echo "workflow, scans the image's system packages; it cannot see these."
            echo ""
            echo "| Module | CVEs >= 7 | Highest |"
            echo "|---|---|---|"
            for module in $BACKEND_MODULES; do
              report="reports/$module/dependency-check-report.xml"
              if [ -f "${report}" ]; then
                # Dependency-Check's XML puts each issue in a <vulnerability> element
                # with a cvssv2 attribute that may be absent on an unscored finding.
                high="$(grep -o 'cvssv2="[4-9]\.[0-9]"' "${report}" 2>/dev/null | wc -l)"
                top="$(grep -o 'cvssv2="[0-9]\.[0-9]"' "${report}" 2>/dev/null \
                       | sed 's/[^0-9.]//g' | sort -rn | head -1)"
                printf '| %s | %s | %s |\n' "${module}" "${high}" "${top:-0.0}"
              else
                printf '| %s | no report | - |\n' "${module}"
              fi
            done
            echo ""
            echo "**Not blocking.** The first scan of a project that has never been"
            echo "scanned is a triage list, not a gate. Reports are in the job summary."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the reports
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: reports
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------- gate ----
  # The single signal main's branch protection reads.
  #
  # if: always() is what makes this meaningful: without it a failed job skips
  # the gate, the gate reports success, and the check never blocks anything.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test, non-regression, coverage-gate]
    if: always()
    steps:
      - name: Collect results
        run: |
          results="${{ needs.lint.result }} ${{ needs.unit-test.result }} ${{ needs.integration-test.result }} ${{ needs.non-regression.result }} ${{ needs.coverage-gate.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "unit-test=${{ needs.unit-test.result }}"
          echo "integration-test=${{ needs.integration-test.result }}"
          echo "non-regression=${{ needs.non-regression.result }}"
          echo "coverage-gate=${{ needs.coverage-gate.result }}"

          for result in $results; do
            if [ "$result" != "success" ]; then
              if [ "$result" = "skipped" ]; then
                echo "::error::A required job was skipped, so this run proves nothing."
              else
                echo "::error::$result"
              fi
              exit 1
            fi
          done
          echo "All checks passed."
