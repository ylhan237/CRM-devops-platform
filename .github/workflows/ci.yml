# Test pipeline for the CRM application.
#
# One workflow, five independent jobs and a gate. The jobs do not depend on each
# other so they run in parallel; only the gate aggregates them. Chaining them, as
# the diagram in note.md suggests, would mean a slow linter delays a test that
# does not need it.
#
# The job names are the ones note.md section 4.4 lists as required status checks
# for main. Renaming one silently changes the branch protection rule, so they are
# the contract between this file and the repository settings.
#
# No container is built or run here. This pipeline tests the application as it
# is, from source, which is the point of this phase: the container build and the
# images come later, in the release workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run in flight. Without this, a series
# of pushes to a PR queues five jobs per commit and the runner minutes go on
# checking revisions nobody will read.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  BACKEND_MODULES: >-
    api-gateway auth-service Event_Management_System Notification_Service
    service-discovery Student_Management_Service Task_Management_Service
  COVERAGE_FLOOR: '0.30'

jobs:
  # ---------------------------------------------------------------- lint ----
  # Static analysis only. It reports, it does not build, and it is the cheapest
  # job, so it is the one that should fail first when something is wrong.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Checkstyle
        # The ruleset lives in CRM_Backend/checkstyle.xml and the build-tools
        # parent binds this goal to validate, so a plain build checks it too.
        # The explicit goal here means the job also works on a module that has
        # not been compiled yet.
        #
        # System Maven rather than the bundled wrapper: mvnw was committed from
        # Windows and carries no executable bit, so ./mvnw is not runnable on a
        # Linux runner.
        run: |
          status=0
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            mvn -B -ntp -f "CRM_Backend/$module/pom.xml" checkstyle:check \
              -Dcheckstyle.failOnViolation=true || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Front/CRM/package-lock.json

      - name: Install frontend dependencies
        working-directory: Front/CRM
        # `npm ci` is what this should use, and is what it used to. It is
        # bypassed here because package-lock.json has not been regenerated since
        # eslint and prettier were added to package.json, and the machine this
        # was written on could not complete an npm install. This line must go
        # back to `npm ci --no-audit` as soon as the lockfile is refreshed.
        run: npm install --no-audit --no-fund

      - name: ESLint
        working-directory: Front/CRM
        # Fails on errors. Warnings are printed and counted in the log: the
        # recommended rule sets are demoted to warnings in eslint.config.js, and
        # the counts from this run are what decides which ones to promote.
        run: npm run lint

      - name: TypeScript type check
        working-directory: Front/CRM
        # The one frontend check that always blocks. It needs no extra tooling
        # and it catches the class of error this codebase actually produces:
        # a renamed method, a wrong argument type, a missing import.
        run: npx tsc --noEmit -p tsconfig.json

      - name: Prettier
        working-directory: Front/CRM
        run: npm run format:check

  # ----------------------------------------------------------- unit-test ----
  # Fast tests, no external service. The seven services are built in sequence
  # rather than as a matrix so the job keeps the single status check name that
  # note.md 4.4 requires; a matrix would publish one check per module and the
  # branch protection rule would have to match all seven.
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Backend tests
        run: |
          status=0
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            # verify rather than test, so jacoco:report runs and the coverage
            # job has something to read.
            mvn -B -ntp -f "CRM_Backend/$module/pom.xml" verify || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Front/CRM/package-lock.json

      - name: Install frontend dependencies
        working-directory: Front/CRM
        run: npm install --no-audit --no-fund

      - name: Frontend specs
        working-directory: Front/CRM
        run: npm run test:ci

  # ----------------------------------------------------- integration-test ----
  # Tests that need a real MySQL. Testcontainers starts it, so no service has to
  # be installed on the runner and no port has to be reserved.
  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Integration tests
        # Surefire and failsafe are split by naming convention in build-tools:
        # *Test runs in the unit-test job, *IT runs here. The flag turns off the
        # unit tests for this run so the same containers are not started twice.
        run: |
          status=0
          for module in $BACKEND_MODULES; do
            echo "::group::$module"
            mvn -B -ntp -f "CRM_Backend/$module/pom.xml" verify \
              -DskipTests=false \
              -Dsurefire.skip=true \
              -Dit.test='*IT' || status=1
            echo "::endgroup::"
          done
          exit $status

  # ------------------------------------------------------ non-regression ----
  # What must not change: the API contract the gateway publishes, and the shape
  # of the MySQL schema the migrations produce. These are the two things a
  # refactor breaks silently, so they get their own job instead of riding along
  # with the unit tests.
  non-regression:
    name: non-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Gateway route contract
        run: mvn -B -ntp -f CRM_Backend/api-gateway/pom.xml verify

      - name: Schema contract against a real MySQL 8
        # An *IT, because it needs a real database: Testcontainers starts MySQL
        # 8 so the schema is produced by the migrations themselves rather than
        # by whatever H2 happens to be on the classpath.
        run: mvn -B -ntp -f CRM_Backend/auth-service/pom.xml verify -Dit.test='*Schema*IT'

  # ------------------------------------------------------- coverage-gate ----
  # Aggregates what unit-test produced. The floor is checked on the total
  # across every module, never per module, for the reason documented in
  # scripts/check-coverage.mjs.
  coverage-gate:
    name: coverage-gate
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # No pom at the repository root, the seven modules each have their
          # own, so the default lookup finds nothing to hash.
          cache-dependency-path: CRM_Backend/**/pom.xml

      - name: Backend coverage
        run: |
          reports=""
          for module in $BACKEND_MODULES; do
            report="CRM_Backend/$module/target/site/jacoco/jacoco.xml"
            if [ -f "$report" ]; then
              reports="$reports $report"
            else
              echo "No JaCoCo report for $module, expected at $report" >&2
              exit 1
            fi
          done
          node scripts/check-coverage.mjs --floor "$COVERAGE_FLOOR" --format jacoco $reports

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Front/CRM/package-lock.json

      - name: Install frontend dependencies
        working-directory: Front/CRM
        run: npm install --no-audit --no-fund

      - name: Frontend coverage
        working-directory: Front/CRM
        run: npm run test:coverage

      - name: Frontend coverage floor
        # The two floors are checked separately rather than added together: a
        # Java report and a JavaScript report measure different code, and
        # summing them would let one side hide the other.
        run: |
          node scripts/check-coverage.mjs \
            --floor "$COVERAGE_FLOOR" \
            --format istanbul \
            Front/CRM/coverage/crm/coverage-summary.json

  # ---------------------------------------------------------------- gate ----
  # The single signal main's branch protection reads.
  #
  # if: always() is what makes this meaningful: without it a failed job skips
  # the gate, the gate reports success, and the check never blocks anything.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [lint, unit-test, integration-test, non-regression, coverage-gate]
    if: always()
    steps:
      - name: Collect results
        run: |
          results="${{ needs.lint.result }} ${{ needs.unit-test.result }} ${{ needs.integration-test.result }} ${{ needs.non-regression.result }} ${{ needs.coverage-gate.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "unit-test=${{ needs.unit-test.result }}"
          echo "integration-test=${{ needs.integration-test.result }}"
          echo "non-regression=${{ needs.non-regression.result }}"
          echo "coverage-gate=${{ needs.coverage-gate.result }}"

          for result in $results; do
            if [ "$result" != "success" ]; then
              if [ "$result" = "skipped" ]; then
                echo "::error::A required job was skipped, so this run proves nothing."
              else
                echo "::error::$result"
              fi
              exit 1
            fi
          done
          echo "All checks passed."
