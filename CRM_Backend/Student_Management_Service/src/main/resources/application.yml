spring:
  config:
    import: "optional:configserver:http://localhost:8088,optional:file:.env[.properties],optional:file:../../.env[.properties]"

  application:
    name: student-service

  datasource:
    url: jdbc:mysql://localhost:3306/candidate?createDatabaseIfNotExist=true&maxAllowedPacket=16777216
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  cloud:
    loadbalancer:
      enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8082

eureka:
  instance:
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0

# ─── Outbound HTTP clients ───────────────────────────────────────────────────
# This service calls the notification service through RestTemplate. The host
# lives here, not in the Java source, so the same jar runs locally and in a
# container. localhost is correct for a local run; override with the compose
# service name or the Kubernetes Service name.
clients:
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
  connect-timeout-ms: ${CLIENTS_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${CLIENTS_READ_TIMEOUT_MS:10000}

# Where DocumentService writes uploaded candidate documents. The default is a
# development path; point it at a mounted volume in a container.
upload:
  dir: ${UPLOAD_DIR:uploads}

