# The Angular bundle served by nginx, same as in the image.
#
# nginx resolves the api-gateway at start-up to resolve its upstream, which means
# a Service that does not exist yet makes nginx refuse to start. initContainers
# exist for exactly this, so the frontend does not crash-loop while the gateway is
# still coming up.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: crm
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crm
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-gateway
          image: busybox:1.36
          command: ["sh", "-c", "until nslookup api-gateway.crm.svc.cluster.local; do sleep 2; done"]
      containers:
        - name: frontend
          image: ghcr.io/ylhan237/frontend:latest
          ports:
            - containerPort: 80
          # The only container here with an HTTP probe worth having: nginx answers
          # on / without any application behind it.
          # Same three probes as the backend, on HTTP rather than a socket, because
          # nginx answers on / without an application behind it. Everywhere else the
          # port is only proven to be open.
          startupProbe:
            httpGet:
              path: /
              port: http
            # 5 x 12 = 60 seconds of grace. nginx answers in milliseconds once it is
            # up, so this only covers the wait for the gateway the initContainer does.
            failureThreshold: 5
            periodSeconds: 12
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            # No initialDelaySeconds: the startup probe is what holds this off.
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi