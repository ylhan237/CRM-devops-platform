# MySQL as a StatefulSet rather than a Deployment.
#
# A Deployment may replace the pod at any moment and come back with an empty
# volume, because the volume would follow the pod name and a new pod means a new
# name. A StatefulSet gives the pod a stable identity, a stable DNS name, and a
# volume that is claimed rather than recreated.
#
# This is what note.md 4.3 asks for, and it is the right shape for a database
# even in a lab.
#
# The storage class is whatever the cluster provides. On a kubeadm cluster built
# by 4.2 there is usually no default StorageClass, in which case the claim stays
# Pending until one is created. That is stated in the README rather than worked
# around here, because a local-path provisioner has to be installed deliberately.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: crm
  labels:
    app: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: crm
  labels:
    app: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mysql-password
          # tcpSocket rather than exec: mysqladmin needs a password on the
          # command line, and a password in a probe definition is a password in
          # the manifest and in the pod spec.
          # A database is the one workload where the startup probe is not optional.
          #
          # A first start initialises the data directory, which on a 5 GiB claim takes
          # long enough that the liveness probe was killing it. That is why this one
          # had a generous initialDelaySeconds: the delay was standing in for the
          # missing startup probe, and it was wrong in both directions, being far too
          # long for every restart after the first and not long enough on a slow disk.
          #
          # 30 attempts every 10 seconds is 5 minutes. A container that has not opened
          # its port in 5 minutes is not slow, it is broken, and restarting it is the
          # right answer rather than a way to hide it.
          #
          # tcpSocket and not exec mysqladmin: mysqladmin needs a password on the
          # command line, and a password in a probe definition is a password in the
          # manifest and in the pod spec.
          startupProbe:
            tcpSocket:
              port: 3306
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            # No initialDelaySeconds: the startup probe holds this off for as long as
            # the database legitimately needs.
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: crm
spec:
  # Bound to the pod name, so the volume follows the identity and not the
  # instance.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi