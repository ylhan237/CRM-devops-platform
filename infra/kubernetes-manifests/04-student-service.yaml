apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: crm
  labels:
    app: student-service
spec:
  type: ClusterIP
  selector:
    app: student-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: crm
  labels:
    app: student-service
spec:
  # One replica. The upload directory is an emptyDir, so a second replica would
  # see a different set of documents; two replicas only make sense once that
  # volume is shared.
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
        - name: student-service
          image: ghcr.io/ylhan237/student-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/candidate?createDatabaseIfNotExist=true&maxAllowedPacket=16777216
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka/
            - name: FILE_UPLOAD_DIR
              value: /var/lib/crm/uploads
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/crm/uploads
      volumes:
        - name: uploads
          emptyDir: {}