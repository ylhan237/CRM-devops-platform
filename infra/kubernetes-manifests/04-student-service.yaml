apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: crm
  labels:
    app: student-service
spec:
  type: ClusterIP
  selector:
    app: student-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: crm
  labels:
    app: student-service
spec:
  # One replica. The upload directory is an emptyDir, so a second replica would
  # see a different set of documents; two replicas only make sense once that
  # volume is shared.
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
        - name: student-service
          image: ghcr.io/ylhan237/student-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/candidate?createDatabaseIfNotExist=true&maxAllowedPacket=16777216
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka/
            - name: FILE_UPLOAD_DIR
              value: /var/lib/crm/uploads
          # Three probes, because they answer three different questions.
          #
          # The startup probe exists so that the liveness probe can be aggressive
          # without becoming a way to kill a service that is still booting. Without
          # it, liveness has to be given an initialDelay long enough for the slowest
          # start, which is either wasteful when the service is healthy in 20 seconds
          # or fatal when it is not. A Spring Boot service on a 4 GiB VM with a cold
          # JIT and a MySQL it has to wait for is not a fixed quantity.
          #
          # While the startup probe is failing, the liveness and readiness probes are
          # not run at all. So: up to 5 x 12 = 60 seconds to open the port, and only
          # then does liveness start checking every 20 seconds.
          startupProbe:
            tcpSocket:
              port: 8082
            # 5 attempts every 12 seconds, so 60 seconds of grace, and a failure kills
            # rather than retries forever.
            failureThreshold: 5
            periodSeconds: 12
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            # No initialDelaySeconds on purpose: the startup probe is what holds the
            # liveness probe off, so the delay would only be subtracted twice.
            periodSeconds: 20
            # 3 failures at 20 seconds is a minute of an established service not
            # accepting connections before it is restarted.
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/crm/uploads
      volumes:
        - name: uploads
          emptyDir: {}