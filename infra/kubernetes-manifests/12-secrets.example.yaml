# TEMPLATE. Copy to crm-secrets.yaml, fill it in, and never commit the copy.
#
#   cp crm-secrets.example.yaml crm-secrets.yaml
#   kubectl -n crm create secret generic crm-secrets --from-env-file=...
#
# or, more simply, apply the filled copy. crm-secrets.yaml is gitignored by
# .gitignore at the root of this directory.
#
# Every value below is a placeholder. The pod will start and the dependency will
# be unreachable rather than wrong, which is a better failure than a real
# credential in a repository.
#
# Generate the JWT key the same way docker-compose does:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  # Must be Base64 decoding to at least 32 bytes. Anything shorter and the HMAC
  # signature throws WeakKeyException at the first login.
  jwt-secret-key: "REPLACE-Base64-32-bytes-minimum"

  db-username: "REPLACE"
  db-password: "REPLACE"

  mysql-root-password: "REPLACE"
  mysql-database: "authdb"
  mysql-user: "REPLACE"
  mysql-password: "REPLACE"

  mail-username: "REPLACE"
  mail-password: "REPLACE"

  # Optional. The notification service starts without them; only the SMS path
  # goes quiet. Leave them as empty strings rather than inventing values.
  twilio-account-sid: ""
  twilio-auth-token: ""
  twilio-phone-number: ""

  # Only needed when the images are pulled from the Azure registry rather than
  # from GHCR. See the README on the pull secret.
  acr-registry-server: "REPLACE.azurecr.io"
  acr-username: "REPLACE"
  acr-password: "REPLACE"