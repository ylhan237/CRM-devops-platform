apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: crm
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: crm
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/ylhan237/auth-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka/
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: jwt-secret-key
            - name: ACTIVATION_URL
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: activation-url
            - name: RESET_PASSWORD_URL
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: reset-password-url
            - name: FILE_UPLOAD_DIR
              value: /var/lib/crm/uploads
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: mail-host
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: mail-port
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mail-username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mail-password
          # tcpSocket, not httpGet on /actuator/health: only service-discovery
          # carries the actuator starter, so an HTTP probe would fail here for a
          # reason that has nothing to do with whether the service is healthy. A
          # socket probe proves the port is being accepted. Adding the actuator to
          # every service would give a real health endpoint, and is the change to
          # make if these probes ever need to be more than liveness.
          # Three probes, because they answer three different questions.
          #
          # The startup probe exists so that the liveness probe can be aggressive
          # without becoming a way to kill a service that is still booting. Without
          # it, liveness has to be given an initialDelay long enough for the slowest
          # start, which is either wasteful when the service is healthy in 20 seconds
          # or fatal when it is not. A Spring Boot service on a 4 GiB VM with a
          # cold JIT and a MySQL it has to wait for is not a fixed quantity.
          #
          # While the startup probe is failing, the liveness and readiness probes are
          # not run at all. So: up to 5 x 12 = 60 seconds to open the port, and only
          # then does liveness start checking every 20 seconds.
          startupProbe:
            tcpSocket:
              port: 8080
            # 5 attempts every 12 seconds, so 60 seconds of grace, and a failure kills
            # rather than retries forever.
            failureThreshold: 5
            periodSeconds: 12
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            # No initialDelaySeconds on purpose: the startup probe is what holds the
            # liveness probe off, so the delay would only be subtracted twice.
            periodSeconds: 20
            # 3 failures at 20 seconds is a minute of an established service not
            # accepting connections before it is restarted.
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/crm/uploads
      volumes:
        # emptyDir rather than a claim: uploaded photos belong to a pod, and two
        # replicas of auth-service cannot share a ReadWriteOnce volume. A single
        # replica plus a claim is the alternative, and is a change to make when
        # the photos matter more than the availability.
        - name: uploads
          emptyDir: {}