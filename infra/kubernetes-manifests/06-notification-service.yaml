apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: crm
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: crm
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/ylhan237/notification-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # No datasource: this service keeps nothing.
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka/
            - name: SPRING_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: mail-host
            - name: SPRING_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: mail-port
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mail-username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mail-password
            # Empty by default in the compose file, and left empty here rather
            # than faked. The service must not fail to start when the sending
            # account is absent; it is the notification path that goes quiet, not
            # the pod.
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: twilio-account-sid
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: twilio-auth-token
                  optional: true
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: twilio-phone-number
                  optional: true
          # Three probes, because they answer three different questions.
          #
          # The startup probe exists so that the liveness probe can be aggressive
          # without becoming a way to kill a service that is still booting. Without
          # it, liveness has to be given an initialDelay long enough for the slowest
          # start, which is either wasteful when the service is healthy in 20 seconds
          # or fatal when it is not. A Spring Boot service on a 4 GiB VM with a cold
          # JIT and a MySQL it has to wait for is not a fixed quantity.
          #
          # While the startup probe is failing, the liveness and readiness probes are
          # not run at all. So: up to 5 x 12 = 60 seconds to open the port, and only
          # then does liveness start checking every 20 seconds.
          startupProbe:
            tcpSocket:
              port: 8085
            # 5 attempts every 12 seconds, so 60 seconds of grace, and a failure kills
            # rather than retries forever.
            failureThreshold: 5
            periodSeconds: 12
          readinessProbe:
            tcpSocket:
              port: 8085
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8085
            # No initialDelaySeconds on purpose: the startup probe is what holds the
            # liveness probe off, so the delay would only be subtracted twice.
            periodSeconds: 20
            # 3 failures at 20 seconds is a minute of an established service not
            # accepting connections before it is restarted.
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi