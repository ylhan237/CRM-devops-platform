apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: crm
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: crm
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/ylhan237/notification-service:latest
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # No datasource: this service keeps nothing.
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka/
            - name: SPRING_MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: mail-host
            - name: SPRING_MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: mail-port
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mail-username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: mail-password
            # Empty by default in the compose file, and left empty here rather
            # than faked. The service must not fail to start when the sending
            # account is absent; it is the notification path that goes quiet, not
            # the pod.
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: twilio-account-sid
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: twilio-auth-token
                  optional: true
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: twilio-phone-number
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi