apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: crm
  labels:
    app: event-service
spec:
  type: ClusterIP
  selector:
    app: event-service
  ports:
    - name: http
      port: 8089
      targetPort: 8089
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: crm
  labels:
    app: event-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: ghcr.io/ylhan237/event-service:latest
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/event_system?createDatabaseIfNotExist=true&maxAllowedPacket=16777216
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: db-password
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://service-discovery:8761/eureka/
          # Three probes, because they answer three different questions.
          #
          # The startup probe exists so that the liveness probe can be aggressive
          # without becoming a way to kill a service that is still booting. Without
          # it, liveness has to be given an initialDelay long enough for the slowest
          # start, which is either wasteful when the service is healthy in 20 seconds
          # or fatal when it is not. A Spring Boot service on a 4 GiB VM with a cold
          # JIT and a MySQL it has to wait for is not a fixed quantity.
          #
          # While the startup probe is failing, the liveness and readiness probes are
          # not run at all. So: up to 5 x 12 = 60 seconds to open the port, and only
          # then does liveness start checking every 20 seconds.
          startupProbe:
            tcpSocket:
              port: 8089
            # 5 attempts every 12 seconds, so 60 seconds of grace, and a failure kills
            # rather than retries forever.
            failureThreshold: 5
            periodSeconds: 12
          readinessProbe:
            tcpSocket:
              port: 8089
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8089
            # No initialDelaySeconds on purpose: the startup probe is what holds the
            # liveness probe off, so the delay would only be subtracted twice.
            periodSeconds: 20
            # 3 failures at 20 seconds is a minute of an established service not
            # accepting connections before it is restarted.
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi