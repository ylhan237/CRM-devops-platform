{{- /*
The Secret, only when the values say to create it.

This is off by default and the reason is worth stating plainly. A Secret rendered
by Helm is stored, base64-encoded, in the release object inside the cluster, so
anyone who can read releases can read the credentials, and `helm install --debug`
prints them to the terminal and into any shell history or CI log that captured
the output. A Secret created with `kubectl create secret` is not stored anywhere
else.

So for anything but a throwaway lab, create the Secret by hand and leave this
false. The README gives the command.

Every value is `required`, so a half-filled values file fails at install with a
clear message rather than producing a pod that cannot reach its database.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "crm.namespace" . }}
  labels:
    {{- include "crm.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret-key: {{ required "secrets.create is true, so secrets.jwtSecretKey must be set. Generate one with: node -e \"console.log(require('crypto').randomBytes(32).toString('base64'))\"" .Values.secrets.jwtSecretKey | quote }}
  db-username: {{ required "secrets.create is true, so secrets.dbUsername must be set." .Values.secrets.dbUsername | quote }}
  db-password: {{ required "secrets.create is true, so secrets.dbPassword must be set." .Values.secrets.dbPassword | quote }}
  mysql-root-password: {{ required "secrets.create is true, so secrets.mysqlRootPassword must be set." .Values.secrets.mysqlRootPassword | quote }}
  mysql-user: {{ required "secrets.create is true, so secrets.mysqlUser must be set. The MySQL grant script needs this name." .Values.secrets.mysqlUser | quote }}
  mysql-password: {{ required "secrets.create is true, so secrets.mysqlPassword must be set." .Values.secrets.mysqlPassword | quote }}
  mail-username: {{ required "secrets.create is true, so secrets.mailUsername must be set." .Values.secrets.mailUsername | quote }}
  mail-password: {{ required "secrets.create is true, so secrets.mailPassword must be set." .Values.secrets.mailPassword | quote }}
{{- end }}
