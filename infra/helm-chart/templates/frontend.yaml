{{- /*
The Angular bundle, served by nginx as in the image.

Two things are specific to this one workload.

The initContainer waits for the gateway. nginx resolves its upstream at start-up,
so a gateway Service that does not exist yet makes nginx refuse to start. Without
the wait the pod crash-loops until the gateway appears, which it eventually would,
so the symptom is a slow start rather than a broken one. The wait makes the slow
start look like a slow start.

The probe is HTTP on `/`, which is the only place in this chart where that is
honest: nginx answers without an application behind it. Everywhere else the port
is only proven to be open.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ include "crm.namespace" . }}
  labels:
    {{- include "crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "crm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ include "crm.namespace" . }}
  labels:
    {{- include "crm.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.frontend.name }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "crm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.frontend.name }}
  template:
    metadata:
      labels:
        {{- include "crm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.frontend.name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "crm.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.frontend.waitForGateway }}
      initContainers:
        - name: wait-for-gateway
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup {{ .Values.gateway.name }}.{{ include "crm.namespace" . }}.svc.cluster.local; do sleep 2; done
      {{- end }}
      containers:
        - name: {{ .Values.frontend.name }}
          image: {{ include "crm.image" (dict "root" . "name" .Values.frontend.name) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- include "crm.scheduling" . | nindent 6 }}
